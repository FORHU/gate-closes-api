name: CI/CD

on:
  push:
    branches:
      - main
      - staging
  
  pull_request:
    branches:
      - main
      - staging

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install Dependencies
        run: yarn install --frozen-lockfile

      - name: Type Checkout
        run: yarn tsc --noEmit

      - name: Run Linter
        run: yarn lint

      - name: Build Gate-closes Project
        run: yarn build

  # Legacy deploy. Runs until the SSM deploy below is switched on by setting
  # the AWS_DEPLOY_ROLE_ARN repository variable; then this job is skipped.
  cd:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AWS_DEPLOY_ROLE_ARN == ''
    runs-on: ubuntu-latest

    steps:
      - name: Automatic deployment
        run: curl -X POST "${{ secrets.COOLIFY_WEBHOOK }}"

  # Deploy to EC2 the fox-passport way: OIDC instead of static AWS keys, SSM
  # Run Command instead of SSH, and the container env file kept encrypted in
  # Parameter Store, so no secret is baked into an image or committed.
  #
  # S3 comes from the instance role: the env file has no AWS_ACCESS_KEY /
  # AWS_SECRET_ACCESS_KEY (see src/utils/s3.ts). Unset values are left out
  # rather than written empty, since an empty value looks configured.
  #
  # Repository variables: AWS_DEPLOY_ROLE_ARN (switch), AWS_REGION,
  # EC2_INSTANCE_ID, ECR_REPOSITORY, optional SSM_ENV_PARAM and
  # DOCKER_PLATFORM (linux/arm64 for a Graviton host), plus the plain
  # settings below. Secrets: MONGO_URI, SECRET_KEY, ACCESS_TOKEN_SECRET,
  # REFRESH_TOKEN_SECRET, MAILER_PASSWORD, REDIS_PASSWORD.
  cd-ssm:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ${{ vars.DOCKER_PLATFORM == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    concurrency:
      group: gate-closes-api-deploy
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      ENV_PARAM: ${{ vars.SSM_ENV_PARAM || '/gate-closes/api-env' }}
      PLATFORM: ${{ vars.DOCKER_PLATFORM || 'linux/amd64' }}
      CONTAINER: gate-closes-api
      APP_DIR: /opt/gate-closes
      PORT: "3001"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: ${{ env.PLATFORM }}
          provenance: false
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      - name: Store env file in Parameter Store
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          ACCESS_TOKEN_SECRET: ${{ secrets.ACCESS_TOKEN_SECRET }}
          REFRESH_TOKEN_SECRET: ${{ secrets.REFRESH_TOKEN_SECRET }}
          MAILER_PASSWORD: ${{ secrets.MAILER_PASSWORD }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          MONGO_DB: ${{ vars.MONGO_DB }}
          REDIS_HOST: ${{ vars.REDIS_HOST }}
          REDIS_PORT: ${{ vars.REDIS_PORT }}
          MAILER_TRANSPORT_HOST: ${{ vars.MAILER_TRANSPORT_HOST }}
          MAILER_TRANSPORT_PORT: ${{ vars.MAILER_TRANSPORT_PORT }}
          MAILER_TRANSPORT_SECURE: ${{ vars.MAILER_TRANSPORT_SECURE }}
          MAILER_EMAIL: ${{ vars.MAILER_EMAIL }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          AWS_S3_BUCKET: ${{ vars.AWS_S3_BUCKET }}
          CLOUD_FRONT_DOMAIN: ${{ vars.CLOUD_FRONT_DOMAIN }}
          ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS }}
          COOKIE_SAME_SITE: ${{ vars.COOKIE_SAME_SITE }}
          # Token expiries are left to the code defaults (15m / 7d) unless set.
          ACCESS_TOKEN_EXPIRY: ${{ vars.ACCESS_TOKEN_EXPIRY }}
          REFRESH_TOKEN_EXPIRY: ${{ vars.REFRESH_TOKEN_EXPIRY }}
        run: |
          set -euo pipefail
          umask 077
          : > env.tmp
          # Write KEY=value only when the value is set.
          put() { if [ -n "${2:-}" ]; then printf '%s=%s\n' "$1" "$2" >> env.tmp; fi; }

          put NODE_ENV production
          put PORT "$PORT"
          put AWS_REGION "$AWS_REGION"
          for key in MONGO_URI MONGO_DB SECRET_KEY ACCESS_TOKEN_SECRET REFRESH_TOKEN_SECRET \
            ACCESS_TOKEN_EXPIRY REFRESH_TOKEN_EXPIRY REDIS_HOST REDIS_PORT REDIS_PASSWORD \
            MAILER_TRANSPORT_HOST MAILER_TRANSPORT_PORT MAILER_TRANSPORT_SECURE MAILER_EMAIL \
            MAILER_PASSWORD GOOGLE_CLIENT_ID AWS_S3_BUCKET CLOUD_FRONT_DOMAIN \
            ALLOWED_ORIGINS COOKIE_SAME_SITE; do
            put "$key" "${!key:-}"
          done

          aws ssm put-parameter \
            --name "$ENV_PARAM" \
            --type SecureString --overwrite \
            --value "file://env.tmp" \
            --region "$AWS_REGION" > /dev/null
          rm -f env.tmp

      - name: Deploy via SSM
        id: send
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail
          ENVFILE="$APP_DIR/api.env"
          COMMANDS=(
            "set -euo pipefail"
            "mkdir -p $APP_DIR"
            "aws ssm get-parameter --name $ENV_PARAM --with-decryption --region $AWS_REGION --query Parameter.Value --output text > $ENVFILE"
            "chmod 600 $ENVFILE"
            "aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $REGISTRY"
            "docker pull --platform $PLATFORM $IMAGE"
            "docker rm -f $CONTAINER 2>/dev/null || true"
            "docker run -d --name $CONTAINER --restart unless-stopped --platform $PLATFORM --env-file $ENVFILE -p 127.0.0.1:$PORT:$PORT $IMAGE"
            # Fail the deploy if the new container never answers /health.
            "for i in \$(seq 1 30); do curl -fsS http://127.0.0.1:$PORT/health > /dev/null && exit 0; sleep 2; done; docker logs --tail 80 $CONTAINER; exit 1"
          )
          # jq builds the JSON, so a quote inside any command cannot break it.
          PARAMS=$(printf '%s\n' "${COMMANDS[@]}" | jq -R . | jq -sc '{commands: .}')

          CMD_ID=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy $CONTAINER ${GITHUB_SHA::7}" \
            --timeout-seconds 900 \
            --parameters "$PARAMS" \
            --query Command.CommandId --output text)
          echo "command_id=$CMD_ID" >> "$GITHUB_OUTPUT"
          echo "SSM command: $CMD_ID"

      - name: Wait for the deploy
        run: |
          set -uo pipefail
          STATUS=Pending
          for i in $(seq 1 90); do
            STATUS=$(aws ssm get-command-invocation \
              --region "$AWS_REGION" \
              --command-id "${{ steps.send.outputs.command_id }}" \
              --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            echo "status: $STATUS"
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break ;; esac
            sleep 10
          done

          aws ssm get-command-invocation \
            --region "$AWS_REGION" \
            --command-id "${{ steps.send.outputs.command_id }}" \
            --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent,StandardErrorContent]' --output text

          [ "$STATUS" = "Success" ] || { echo "::error::deploy $STATUS"; exit 1; }

      - name: Prune old images
        if: success()
        run: |
          aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "prune images" \
            --parameters '{"commands":["docker image prune -f"]}' > /dev/null
