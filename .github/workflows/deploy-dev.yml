name: Deploy Dev

# FORHU/gate-closes-api → the shared dev host (ap-southeast-1).
#
# One EC2 instance runs every project's dev environment. This workflow owns
# only its own container; it cannot touch another project's, and the deploy
# role cannot reach any host but this one.
#
# BEFORE THE FIRST RUN
#   1. Repository variable:
#        AWS_DEV_DEPLOY_ROLE_ARN = arn:aws:iam::617163942417:role/forhu-deploy
#      A new name on purpose: AWS_DEPLOY_ROLE_ARN already points at production
#      in several repos, and in gate-closes-api it switches the deploy target.
#   2. Check APP_PORT against this repo's Dockerfile — it is the port the
#      process listens on inside the container. HOST_PORT is allocated per
#      project and must not change; see /etc/caddy/sites/00-PORTS.md.
#   3. Put this project's own secrets in the `dev` environment, and list them
#      in the "Publish project env" step. DATABASE_URL, REDIS_URL and
#      RABBITMQ_URL come from the host — do NOT set them here.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        # No default: a hardcoded branch fetches something that may not exist and
        # fails in checkout before anything is built. Blank falls back to
        # github.ref_name, the branch this was dispatched from.
        description: "Branch, tag or SHA to deploy (blank = the branch you ran this from)"
        required: false
  # Uncomment once a dev branch exists and the team wants push-to-deploy.
  # push:
  #   branches: [dev]

concurrency:
  group: forhu-dev-gatecloses
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-1
  ACCOUNT_ID: "617163942417"
  INSTANCE_ID: i-0f95a93145ea25e7a
  ECR_REPOSITORY: gate-closes-api
  CONTAINER: gatecloses-api
  NETWORK: forhu-dev
  HOST_PORT: "4020"
  APP_PORT: "3001"
  ENV_PARAM: /forhu-dev/gatecloses-api/env
  SHARED_ENV: /opt/forhu-dev/credentials/gatecloses.env
  MERGED_ENV: /opt/forhu-dev/gatecloses-api.env

jobs:
  deploy:
    name: Build and deploy (gatecloses dev)
    # Native arm64: the host is Graviton. An image built on ubuntu-latest is
    # amd64, pulls cleanly, then dies with "exec format error". Do not
    # cross-build under QEMU — Node and Prisma builds take hours and look hung.
    runs-on: ubuntu-24.04-arm
    environment: staging

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref_name }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEV_DEPLOY_ROLE_ARN || 'arn:aws:iam::617163942417:role/forhu-deploy' }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve image tag
        id: tag
        run: |
          # dev- prefix so a dev image can never be mistaken for, or overwrite,
          # a production tag in the same ECR repository.
          echo "tag=dev-$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "registry=${{ env.ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com" >> "$GITHUB_OUTPUT"

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region "${{ env.AWS_REGION }}" \
            | docker login --username AWS --password-stdin "${{ steps.tag.outputs.registry }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/arm64
          provenance: false
          tags: ${{ steps.tag.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.tag.outputs.tag }}

      # This project's own secrets only. Anything unset is omitted rather than
      # written empty: an empty value looks configured and silently disables
      # whatever reads it, which is how three features were found dead on the
      # UK stack.
      - name: Publish project env to Parameter Store
        env:
          ACCESS_TOKEN_EXPIRY: ${{ secrets.ACCESS_TOKEN_EXPIRY || vars.ACCESS_TOKEN_EXPIRY }}
          ACCESS_TOKEN_SECRET: ${{ secrets.ACCESS_TOKEN_SECRET || vars.ACCESS_TOKEN_SECRET }}
          ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS || vars.ALLOWED_ORIGINS }}
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET || vars.AWS_S3_BUCKET }}
          CLOUD_FRONT_DOMAIN: ${{ secrets.CLOUD_FRONT_DOMAIN || vars.CLOUD_FRONT_DOMAIN }}
          COOKIE_SAME_SITE: ${{ secrets.COOKIE_SAME_SITE || vars.COOKIE_SAME_SITE }}
          COOKIE_SECURE: ${{ secrets.COOKIE_SECURE || vars.COOKIE_SECURE }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID || vars.GOOGLE_CLIENT_ID }}
          MAILER_EMAIL: ${{ secrets.MAILER_EMAIL || vars.MAILER_EMAIL }}
          MAILER_PASSWORD: ${{ secrets.MAILER_PASSWORD || vars.MAILER_PASSWORD }}
          MAILER_TRANSPORT_HOST: ${{ secrets.MAILER_TRANSPORT_HOST || vars.MAILER_TRANSPORT_HOST }}
          MAILER_TRANSPORT_PORT: ${{ secrets.MAILER_TRANSPORT_PORT || vars.MAILER_TRANSPORT_PORT }}
          MAILER_TRANSPORT_SECURE: ${{ secrets.MAILER_TRANSPORT_SECURE || vars.MAILER_TRANSPORT_SECURE }}
          REFRESH_TOKEN_EXPIRY: ${{ secrets.REFRESH_TOKEN_EXPIRY || vars.REFRESH_TOKEN_EXPIRY }}
          REFRESH_TOKEN_SECRET: ${{ secrets.REFRESH_TOKEN_SECRET || vars.REFRESH_TOKEN_SECRET }}
          SECRET_KEY: ${{ secrets.SECRET_KEY || vars.SECRET_KEY }}
          SERVICE_ACCOUNT: ${{ secrets.SERVICE_ACCOUNT || vars.SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          umask 077

          # PORT must match APP_PORT above and the Dockerfile's EXPOSE.
          printf 'NODE_ENV=production\n'                   > env.tmp
          printf 'PORT=%s\n' '${{ env.APP_PORT }}'        >> env.tmp
          printf 'AWS_REGION=%s\n' '${{ env.AWS_REGION }}' >> env.tmp

          # No database URL here: it comes from SHARED_ENV, which the deploy
          # step concatenates ahead of this file. Setting it in GitHub would
          # override the host's own value and point the app somewhere that only
          # resolves inside this VPC anyway.
          #
          # No AWS_ACCESS_KEY / AWS_SECRET_ACCESS_KEY either. src/utils/s3.ts
          # passes `credentials` only when BOTH are set and otherwise lets the
          # SDK resolve the instance role — which is what this host provides. A
          # partial pair makes the SDK skip its provider chain entirely.
          #
          # Written only when set. `add` returns 0 on purpose: under `set -e` a
          # bare `[ -n "$x" ] && printf ...` aborts on the first empty value.
          add() { [ -n "${2:-}" ] && printf '%s=%s\n' "$1" "$2" >> env.tmp; return 0; }

          add ACCESS_TOKEN_EXPIRY          "${ACCESS_TOKEN_EXPIRY:-}"
          add ACCESS_TOKEN_SECRET          "${ACCESS_TOKEN_SECRET:-}"
          add ALLOWED_ORIGINS              "${ALLOWED_ORIGINS:-}"
          add AWS_S3_BUCKET                "${AWS_S3_BUCKET:-}"
          add CLOUD_FRONT_DOMAIN           "${CLOUD_FRONT_DOMAIN:-}"
          add COOKIE_SAME_SITE             "${COOKIE_SAME_SITE:-}"
          add COOKIE_SECURE                "${COOKIE_SECURE:-}"
          add GOOGLE_CLIENT_ID             "${GOOGLE_CLIENT_ID:-}"
          add MAILER_EMAIL                 "${MAILER_EMAIL:-}"
          add MAILER_PASSWORD              "${MAILER_PASSWORD:-}"
          add MAILER_TRANSPORT_HOST        "${MAILER_TRANSPORT_HOST:-}"
          add MAILER_TRANSPORT_PORT        "${MAILER_TRANSPORT_PORT:-}"
          add MAILER_TRANSPORT_SECURE      "${MAILER_TRANSPORT_SECURE:-}"
          add REFRESH_TOKEN_EXPIRY         "${REFRESH_TOKEN_EXPIRY:-}"
          add REFRESH_TOKEN_SECRET         "${REFRESH_TOKEN_SECRET:-}"
          add SECRET_KEY                   "${SECRET_KEY:-}"
          add SERVICE_ACCOUNT              "${SERVICE_ACCOUNT:-}"

          aws ssm put-parameter \
            --name "${{ env.ENV_PARAM }}" \
            --type SecureString --overwrite \
            --value "file://env.tmp" \
            --region "${{ env.AWS_REGION }}" > /dev/null
          rm -f env.tmp

      - name: Deploy via SSM
        id: send
        env:
          REGISTRY: ${{ steps.tag.outputs.registry }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          IMAGE="${REGISTRY}/${{ env.ECR_REPOSITORY }}:${TAG}"

          COMMANDS=(
            "set -euo pipefail"
            "cat ${{ env.SHARED_ENV }} > ${{ env.MERGED_ENV }}"
            "aws ssm get-parameter --name ${{ env.ENV_PARAM }} --with-decryption --region ${{ env.AWS_REGION }} --query Parameter.Value --output text >> ${{ env.MERGED_ENV }}"
            "chmod 600 ${{ env.MERGED_ENV }}"
            "aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${REGISTRY}"
            "docker container prune -f || true"
            "docker image prune -af || true"
            "docker pull --platform linux/arm64 ${IMAGE}"
            "docker rm -f ${{ env.CONTAINER }} 2>/dev/null || true"
            "docker run -d --name ${{ env.CONTAINER }} --restart unless-stopped --platform linux/arm64 --network ${{ env.NETWORK }} --env-file ${{ env.MERGED_ENV }} -p 127.0.0.1:${{ env.HOST_PORT }}:${{ env.APP_PORT }} ${IMAGE}"
          )

          # jq builds the JSON, so a quote inside any command cannot break it.
          PARAMS=$(printf '%s\n' "${COMMANDS[@]}" | jq -R . | jq -sc '{commands: .}')

          CMD_ID=$(aws ssm send-command \
            --region "${{ env.AWS_REGION }}" \
            --instance-ids "${{ env.INSTANCE_ID }}" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${{ env.CONTAINER }} ${TAG}" \
            --timeout-seconds 900 \
            --parameters "${PARAMS}" \
            --query Command.CommandId --output text)

          echo "command_id=$CMD_ID" >> "$GITHUB_OUTPUT"
          echo "SSM command: $CMD_ID"

      - name: Wait for the deploy
        run: |
          set -uo pipefail
          STATUS=Pending
          for i in $(seq 1 90); do
            STATUS=$(aws ssm get-command-invocation \
              --region "${{ env.AWS_REGION }}" \
              --command-id "${{ steps.send.outputs.command_id }}" \
              --instance-id "${{ env.INSTANCE_ID }}" \
              --query Status --output text 2>/dev/null || echo Pending)
            echo "status: $STATUS"
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break ;; esac
            sleep 10
          done

          aws ssm get-command-invocation \
            --region "${{ env.AWS_REGION }}" \
            --command-id "${{ steps.send.outputs.command_id }}" \
            --instance-id "${{ env.INSTANCE_ID }}" \
            --query '[StandardOutputContent,StandardErrorContent]' --output text

          [ "$STATUS" = "Success" ] || { echo "::error::deploy $STATUS"; exit 1; }
