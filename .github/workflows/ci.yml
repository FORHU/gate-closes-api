name: CI

on:
  push:
    branches:
      - main
      - staging
  
  pull_request:
    branches:
      - main
      - staging

jobs:
  build:
    run-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install Dependencies
        run: yarn install --frozen-lockfile

      - name: Type Checkout
        run: yarn tsc --noEmit

      - name: Build Gate-closes Project
        run: yarn build
        